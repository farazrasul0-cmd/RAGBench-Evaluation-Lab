name: RAGBench CI/CD Quality Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality:
    name: Backend Regression & Strict Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Lint with Ruff
        run: |
          ruff check backend/app

      - name: Strict Type Check with Mypy
        working-directory: backend
        run: |
          mypy app

      - name: Run Backend Pytest Suite
        run: |
          pytest -q -m "not slow" backend

      - name: Verify Academic Report CLI
        working-directory: backend
        run: |
          python -m app.cli.main report generate --output-dir reports/

  frontend-quality:
    name: Frontend Vitest Suite & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci || npm install

      - name: Lint with Oxlint
        working-directory: frontend
        run: |
          npm run lint

      - name: Strict TypeScript Check
        working-directory: frontend
        run: |
          npm run typecheck

      - name: Run Vitest Suite
        working-directory: frontend
        run: |
          npm run test:run

      - name: Build Production Assets
        working-directory: frontend
        run: |
          npm run build
