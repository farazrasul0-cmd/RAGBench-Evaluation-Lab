# RQ1: Chunking Strategy & Granularity Sensitivity Study
# Full factorial sweep isolating chunk size (200, 400) across Fixed, Recursive, and Sentence strategies.
metadata:
  name: "rq1_chunking_sweep"
  description: "RQ1 empirical sweep: 3 strategies (Fixed, Recursive, Sentence) x 2 sizes (200, 400) = 6 conditions."
  author: "RAGBench Research Team"

parameters:
  chunking:
    strategy: ["fixed", "recursive", "sentence"]
    chunk_size: [200, 400]
    chunk_overlap: [20]
  embedding:
    provider: "fastembed"
    model: "BAAI/bge-small-en-v1.5"
  retrieval:
    strategy: "dense"
    k: 5
  generation:
    provider: "mock"
    model: "mock-deterministic"
    temperature: 0.0
